name = "english-app"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "english-app"
# Chạy `npx wrangler d1 create english-app` rồi dán database_id vào đây
database_id = "bf563b64-d664-476d-9b7b-a4a1247d0711"
migrations_dir = "migrations"

# File người học tải lên được lưu trong D1 (bảng file_blobs), không cần R2.
# Muốn dùng R2 thay thế: bật R2 trên dashboard, tạo bucket (`npx wrangler r2 bucket create english-app-files`)
# rồi bỏ dấu # ở 3 dòng dưới. App tự dùng R2 khi có binding FILES.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "english-app-files"

[triggers]
# Mỗi 10 phút: nhắc học (nếu đúng giờ), tạo lại đề xuất tuần khi AI lỗi, gửi lại email chưa gửi được
crons = ["*/10 * * * *"]

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Secrets (không commit): GEMINI_API_KEY, APP_PASSWORD, SESSION_SECRET
# Local: đặt trong .dev.vars | Production: npx wrangler secret put <NAME>

# Lưu log của Worker trên dashboard (Workers > english-app > Logs) để xem lỗi AI trên production
[observability]
enabled = true
